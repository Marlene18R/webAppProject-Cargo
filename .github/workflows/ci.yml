name: CI

on:
  push:
    branches: [prueba]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend-mep/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: backend-mep

      - name: Run ESLint
        run: npm run lint
        working-directory: backend-mep

      - name: Run Prettier format check
        run: npm run format:check
        working-directory: backend-mep

  deploy:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/prueba'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install backend dependencies
        run: npm install
        working-directory: backend-mep

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: myapp-marlene
          package: backend-mep
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
