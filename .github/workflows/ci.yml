name: CI

on:
  push:
    branches: [prueba]

defaults:
  run:
    working-directory: backend-mep

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend-mep/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier format check
        run: npm run format:check
  deploy:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/prueba'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend-mep

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: myapp-marlene
          package: .
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
